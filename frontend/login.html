<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 飞书妙记</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/vendor/remixicon/remixicon.css" />
  <link rel="stylesheet" href="/assets/style.css?v=20260806-feishu-sso" />
</head>
<body>
  <div id="app" class="login-page">
    <main class="login-card">
      <h1>飞书妙记</h1>
      <p class="subtitle">飞书登录将同时授权妙记权限；也可使用用户名密码</p>
      <p id="login-error" class="login-error hidden"></p>
      <button id="feishu-sso-btn" class="btn btn-primary" type="button"><i class="ri ri-flashlight-line" aria-hidden="true"></i><span class="btn-label">飞书登录 / 注册</span></button>
      <div class="login-divider" aria-hidden="true"><span>或</span></div>
      <label class="field field-wide">
        <span>用户名</span>
        <input id="admin-username-input" type="text" autocomplete="username" placeholder="用户名" />
      </label>
      <label class="field field-wide">
        <span>密码</span>
        <input id="admin-password-input" type="password" autocomplete="current-password" placeholder="密码" />
      </label>
      <button id="login-btn" class="btn" type="button"><i class="ri ri-login-box-line" aria-hidden="true"></i><span class="btn-label">密码登录</span></button>
      <p class="login-foot">没有账号？可用飞书直接登录，或持邀请链接 <a href="/register.html">密码注册</a></p>
    </main>
  </div>
  <script defer src="/assets/config.js?v=20260805-sameorigin"></script>
  <script defer src="/assets/common.js?v=20260806-feishu-sso"></script>
  <script defer src="/assets/login.js?v=20260806-feishu-sso"></script>
</body>
</html>
