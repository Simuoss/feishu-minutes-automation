<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>密钥管理 · 飞书妙记</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/vendor/remixicon/remixicon.css" />
  <link rel="stylesheet" href="/assets/style.css?v=20260805-sidebar" />
</head>
<body class="admin-body" data-admin-page="keys">
  <div id="app" class="admin-shell">
    <aside id="admin-sidebar" class="admin-sidebar" aria-label="管理导航"></aside>
    <div class="admin-main">
    <header class="header admin-header">
      <div class="header-main">
        <div>
          <h1>密钥管理</h1>
          <p class="subtitle">创建与吊销访客访问密钥</p>
        </div>
      </div>
    </header>

    <main class="view">
      <section class="panel">
        <h2 class="panel-title">新建密钥</h2>
        <div class="filter-grid">
          <label class="field">
            <span>名称</span>
            <input id="key-name" type="text" placeholder="例如：外部学员 A" />
          </label>
          <label class="field">
            <span>过期时间</span>
            <input id="key-expires" type="datetime-local" />
          </label>
        </div>
        <div class="actions-left" style="margin-top: 0.75rem;">
          <button id="create-key-btn" class="btn btn-primary" type="button"><i class="ri ri-add-line" aria-hidden="true"></i><span class="btn-label">创建</span></button>
        </div>
        <p id="key-create-result" class="share-result hidden"></p>
      </section>

      <section class="panel">
        <div class="actions-right" style="margin-bottom: 0.75rem;">
          <label class="modal-check">
            <input id="include-revoked" type="checkbox" />
            <span>显示已吊销</span>
          </label>
          <button id="refresh-keys-btn" class="btn btn-sm" type="button"><i class="ri ri-refresh-line" aria-hidden="true"></i><span class="btn-label">刷新</span></button>
        </div>
        <div id="keys-status" class="status"></div>
        <ul id="keys-list" class="meeting-list"></ul>
      </section>

      <section id="logs-panel" class="panel hidden">
        <h2 class="panel-title">访问日志 · <span id="logs-key-name"></span></h2>
        <ul id="logs-list" class="meeting-list"></ul>
      </section>
    </main>
    </div>
  </div>

  <script defer src="/assets/config.js?v=20260805-sameorigin"></script>
  <script defer src="/assets/admin-shell.js?v=20260805-sidebar"></script>
  <script defer src="/assets/common.js?v=20260805-thinking"></script>
  <script defer src="/assets/keys.js?v=20260805-thinking"></script>
</body>
</html>
